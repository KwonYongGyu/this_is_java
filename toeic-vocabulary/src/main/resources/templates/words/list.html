<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('단어 목록')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <h1>단어 목록</h1>

    <div class="card" style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
        <form th:action="@{/words}" method="get" style="display:flex; gap:8px;">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="단어 또는 뜻으로 검색"
                   style="padding:9px 12px; border:1px solid #d7dbe0; border-radius:8px; width:240px;">
            <button type="submit" class="btn btn-secondary">검색</button>
            <a href="/words" class="btn btn-secondary" th:if="${!#strings.isEmpty(keyword)}">초기화</a>
        </form>
        <a href="/words/new" class="btn btn-primary">+ 새 단어 등록</a>
    </div>

    <div th:if="${#lists.isEmpty(words)}" class="empty-state card">
        검색 결과가 없거나 등록된 단어가 없습니다.
    </div>

    <table th:unless="${#lists.isEmpty(words)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>단어</th>
            <th>뜻</th>
            <th>예문</th>
            <th>암기 여부</th>
            <th>등록일</th>
            <th style="text-align:right;">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="word : ${words}">
            <td th:text="${word.id}"></td>
            <td th:text="${word.vocabulary}" style="font-weight:600;"></td>
            <td th:text="${word.meaning}"></td>
            <td th:text="${word.exampleSentence}"></td>
            <td>
                <form th:action="@{/words/{id}/toggle(id=${word.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="page" th:value="${currentPage}">
                    <button type="submit" class="badge done" style="border:none;cursor:pointer;"
                            th:if="${word.memorized}">암기완료</button>
                    <button type="submit" class="badge pending" style="border:none;cursor:pointer;"
                            th:unless="${word.memorized}">미암기</button>
                </form>
            </td>
            <td th:text="${#temporals.format(word.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td style="text-align:right; white-space:nowrap;">
                <a th:href="@{/words/{id}/edit(id=${word.id})}" class="btn btn-secondary btn-sm">수정</a>
                <form th:action="@{/words/{id}/delete(id=${word.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 -->
    <div th:if="${totalPages > 1}" style="margin-top:20px; text-align:center;">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/words(keyword=${keyword}, page=${i})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'btn-primary' : 'btn-secondary'"
           class="btn btn-sm"
           style="margin:0 3px;"></a>
    </div>
</div>
</body>
</html>
