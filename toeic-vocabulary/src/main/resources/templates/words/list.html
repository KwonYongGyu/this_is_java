<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TOEIC 단어장</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>TOEIC 단어장</h1>
<a href="/words/new">+ 새 단어 등록</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>단어</th>
        <th>뜻</th>
        <th>예문</th>
        <th>암기 여부</th>
        <th>등록일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="word : ${words}">
        <td th:text="${word.id}"></td>
        <td th:text="${word.vocabulary}"></td>
        <td th:text="${word.meaning}"></td>
        <td th:text="${word.exampleSentence}"></td>
        <td th:text="${word.memorized} ? '암기완료' : '미암기'"></td>
        <td th:text="${word.createdAt}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
