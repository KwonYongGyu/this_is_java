<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">TOEIC 단어장</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #2b2f36;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }
        /* 상단 네비게이션 */
        .navbar {
            background-color: #2f6fed;
            padding: 14px 0;
            margin-bottom: 28px;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .navbar .brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
        }
        .navbar nav a {
            color: #eaf0ff;
            text-decoration: none;
            margin-left: 18px;
            font-size: 0.95rem;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background-color 0.15s;
        }
        .navbar nav a:hover {
            background-color: rgba(255,255,255,0.15);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #1c2733;
        }

        /* 카드형 박스 */
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 24px;
        }

        /* 테이블 */
        table {
            border-collapse: collapse;
            width: 100%;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #eef0f3;
            font-size: 0.92rem;
        }
        th {
            background-color: #f0f3f9;
            color: #45505c;
            font-weight: 600;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #fafbfd; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .badge.done { background-color: #e3f7e8; color: #1e8a3c; }
        .badge.pending { background-color: #fff1e0; color: #b8630a; }

        /* 버튼 */
        .btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.88; }
        .btn-primary { background-color: #2f6fed; color: #fff; }
        .btn-secondary { background-color: #eceff3; color: #333; }
        .btn-danger { background-color: #fdeceb; color: #d64545; }
        .btn-sm { padding: 6px 12px; font-size: 0.82rem; }

        .top-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        /* 폼 */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d7dbe0;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2f6fed;
            box-shadow: 0 0 0 3px rgba(47,111,237,0.15);
        }
        .error {
            color: #d64545;
            font-size: 0.82rem;
            margin-top: 4px;
            display: block;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            background-color: #fdeceb;
            color: #d64545;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .form-actions {
            margin-top: 24px;
            display: flex;
            gap: 10px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: #8a94a3;
        }
    </style>
</head>
<body>
<div th:fragment="header" class="navbar">
    <div class="container">
        <a href="/words" class="brand">📚 TOEIC 단어장</a>
        <nav>
            <a href="/words">단어 목록</a>
            <a href="/words/new">새 단어 등록</a>
            <a href="/logout">로그아웃</a>
        </nav>
    </div>
</div>
</body>
</html>
